# Default configuration; existing personal settings are preserved.
# Keep ROV: automatic/RTV can render white 3D on NVIDIA.
render_target_path_d3d12 = "rov"
user_language = 1
redbaron_skip_splash = true

# Controller and keyboard/mouse share player 1 by default.
redbaron_keyboard_player = 0
# 1..4 reserves that slot for keyboard/mouse.
# Four input profiles do not enable four local cameras.
input_backend = "sdl"
hid_mappings_file = "gamecontrollerdb.txt"
mnk_mode = true
# Mouse movement is disabled; buttons remain enabled.
mnk_mouse = false

# FlyingAce preset. Names refer to Xbox 360 buttons.
keybind_lstick_up = "W"
keybind_lstick_down = "S"
keybind_lstick_left = "A"
keybind_lstick_right = "D"
keybind_lstick_press = "F"

# Aircraft maneuvers / native right-stick actions.
keybind_rstick_up = "Up"
keybind_rstick_down = "Down"
keybind_rstick_left = "Left"
keybind_rstick_right = "Right"
keybind_rstick_press = "V"

keybind_a = "Space"
keybind_b = "Backspace"
keybind_x = "C"
keybind_y = "E"
keybind_right_trigger = "LMB,J"
keybind_left_trigger = "RMB,K"
keybind_left_shoulder = "Q,MMB"
keybind_right_shoulder = "R"
keybind_start = "Return,Escape"
keybind_back = "Tab"
keybind_guide = ""

# Separate digital D-pad (Num Lock enabled).
keybind_dpad_up = "Numpad8"
keybind_dpad_down = "Numpad2"
keybind_dpad_left = "Numpad4"
keybind_dpad_right = "Numpad6"
